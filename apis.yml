x-coverage:
  state: gated
  reason: partner-login
  detail: >-
    Anixter runs a real MuleSoft Anypoint API platform — api.wesco.com resolves to
    api-wesco.lb.anypointdns.net and the Anypoint Exchange organization domain "anixter"
    has its public portal switched on — but that portal publishes zero public assets, so
    every API asset sits behind an Anypoint login, and the eCommerce integrations page
    that describes the EDI and punchout surface answers 403 behind a Cloudflare managed
    challenge on top of it.
  evidence:
    - url: https://anypoint.mulesoft.com/exchange/api/v2/portals/anixter
      status: 200
    - url: https://anypoint.mulesoft.com/exchange/api/v2/assets?domain=anixter&limit=50
      status: 200
    - url: https://anypoint.mulesoft.com/exchange/api/v2/portals/zzznotarealportal12345
