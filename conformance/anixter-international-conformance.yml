    - cXML PunchOut / SAP OCI
  declared_in_contract: false
  note: >-
    0.12.0 domain_standard_conformance reads the CONTRACT, not a marketing page. Anixter
    names EDI and punchout in prose but publishes no OpenAPI, WSDL, XSD, cXML DTD
