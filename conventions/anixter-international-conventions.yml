description: >-
  Cross-cutting runtime semantics for Anixter International. Anixter does not operate a
  public REST API: its documented integration surface is EDI document exchange, punchout
  catalog round trips, and flat file catalog delivery, all provisioned per customer
  through a commercial onboarding conversation. Every convention below is therefore
  recorded as undocumented rather than as a value we inferred.
auth_style:
  documented: false
  scheme: null
  note: >-
    No authentication scheme is published. EDI and punchout connections are credentialed
    during customer onboarding (trading partner IDs, punchout shared secrets), which is
    per-customer configuration, not a documented public auth model.
